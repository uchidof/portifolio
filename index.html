<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portifolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra superior -->
 <header class="topbar">
  <button id="langToggle" class="lang-btn">PT</button>

  <nav class="menu-right">
    <a href="#about" class="menu-item" data-i18n="about">About Me</a>
    <a href="#projects" class="menu-item" data-i18n="projects">Projects</a>
    <a href="#contact" class="menu-item" data-i18n="contact">Contact</a>
  </nav>
</header>

<!-- Seção INICIAL -->
<section class="hero">
  <div class="content">

    <div class="image-box">
        <img src="/assets/images/profile.jpg">
    </div>

    <div class="text-area">
      <h1 data-i18n="title">HELLO WORLD! o</h1>

      <p data-i18n="description">
        Quick description... 
      </p>
    </div>

  </div>
</section>

<section id="projects" class="projects-section">
  <div class="container">

    <div class="projects-header">
      <h2 data-i18n="projectsTitle">PROJETOS</h2>
      <p data-i18n="projectsDescription">
        Descricao para secao de projetos.
      </p>
    </div>

    <div class="projects-filters" id="projectsFilters"></div>

      <div class="carousel-wrapper">

        <button class="carousel-btn prev">←</button>

        <div class="projects-carousel" id="projectsCarousel" >

        </div>

        <button class="carousel-btn next">→</button>

    </div>

  </div>
</section>

<section id="contact" class="contact-section">
  <div class="container">

    <div class="contact-header">
      <h2 data-i18n="contactTitle">CONTACT</h2>
      <p data-i18n="contactDescription">
        Interested in working together or have a question?
      </p>
    </div>

    <div class="contact-list">

  <a href="https://github.com/uchidof" target="_blank" class="contact-item">
    <img src="assets/icons/github.svg" alt="GitHub">
    <span class="contact-label">github.com/uchidof</span>
  </a>

  <a href="https://www.linkedin.com/in/filipe-uchidomari/" target="_blank" class="contact-item">
    <img src="assets/icons/linkedin.svg" alt="LinkedIn">
    <span class="contact-label">linkedin.com/in/filipe-uchidomari</span>
  </a>

  <a href="mailto:fuchidomarib@gmail.com" class="contact-item">
    <img src="assets/icons/envelope.svg" alt="Email">
    <span class="contact-label">fuchidomarib@gmail.com</span>
  </a>

</div>

  </div>
</section>

<script src="github-lang-colors.js"></script>
<script src="projects.js"></script>
<script src="script.js"></script>

</body>
</html>
