<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portifolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra superior -->
 <header class="topbar">
  <button id="langToggle" class="lang-btn">PT</button>

  <nav class="menu-right">
    <a href="#about" class="menu-item" data-i18n="about">About Me</a>
    <a href="#projects" class="menu-item" data-i18n="projects">Projects</a>
    <a href="#contact" class="menu-item" data-i18n="contact">Contact</a>
  </nav>
</header>

<!-- Seção INICIAL -->
<section class="hero">
  <div class="content">

    <div class="image-box">
        <img src="/assets/images/profile.jpg">
    </div>

    <div class="text-area">
      <h1 data-i18n="title">HELLO WORLD</h1>

      <p data-i18n="description">
        Quick description...
      </p>
    </div>

  </div>
</section>

<section id="projects" class="projects-section">

  <div class="projects-header">
    <h2 data-i18n="projectsTitle">PROJETOS</h2>
    <p data-i18n="projectsDescription">Lorem Ipsum is simply dummy text of the printing and typesetting industry.</p>

    <div class="tags-filter">
      <button class="tag">TAG</button>
    </div>
  </div>

  <div class="projects-grid">

    <!-- Card -->
    <div class="project-card">
      <h3>Titulo projeto</h3>
      <p>Descrição do projeto. Uma frase para descreve-lo.</p>

      <div class="card-footer">
        <span class="tag small">TAG</span>
        <button class="details-btn">+ Detalhes □</button>
      </div>
    </div>

  </div>

</section>

<script src="script.js"></script>

</body>
</html>
